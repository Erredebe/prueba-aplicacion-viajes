<section class="panel">
  <header class="panel-header">
    <h2>Detalles del viaje</h2>
    <span class="status-chip">{{ details.status }}</span>
  </header>
  <div class="panel-body">
    <div class="detail-grid">
      <div>
        <p class="label">Código</p>
        <p class="value">{{ details.code }}</p>
      </div>
      <div>
        <p class="label">Origen</p>
        <p class="value">{{ details.origin }}</p>
      </div>
      <div>
        <p class="label">Destino</p>
        <p class="value">{{ details.destination }}</p>
      </div>
      <div>
        <p class="label">Salida</p>
        <p class="value">{{ details.departure }}</p>
      </div>
      <div>
        <p class="label">Regreso</p>
        <p class="value">{{ details.return }}</p>
      </div>
      <div>
        <p class="label">Aerolínea</p>
        <p class="value">{{ details.airline }}</p>
      </div>
      <div>
        <p class="label">Hotel</p>
        <p class="value">{{ details.hotel }}</p>
      </div>
    </div>
  </div>
</section>
