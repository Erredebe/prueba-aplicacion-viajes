<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-dot"></span>
      <div>
        <h1>Viajes 360</h1>
        <p class="muted">Panel de control</p>
      </div>
    </div>
    <nav class="nav">
      <a class="nav-link active" href="#">Dashboard</a>
      <a class="nav-link" href="#">Reservas</a>
      <a class="nav-link" href="#">Pasajeros</a>
      <a class="nav-link" href="#">Itinerario</a>
      <a class="nav-link" href="#">Reportes</a>
    </nav>
    <div class="sidebar-footer">
      <p class="muted">Agente asignado</p>
      <p class="agent">Laura Castillo</p>
      <button class="primary-btn">Crear actualización</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div>
        <p class="muted">Bienvenido de vuelta</p>
        <h2>{{ title() }}</h2>
      </div>
      <div class="topbar-actions">
        <div class="status-pill">
          <span class="dot"></span>
          Última actualización: hace 2h
        </div>
        <button class="secondary-btn">Exportar</button>
      </div>
    </header>

    <section class="dashboard-section">
      <app-trip-dashboard></app-trip-dashboard>
    </section>

    <section class="dashboard-grid">
      <app-trip-details></app-trip-details>
      <app-passengers></app-passengers>
    </section>

    <section class="dashboard-section">
      <app-itinerary></app-itinerary>
    </section>
  </main>
</div>
